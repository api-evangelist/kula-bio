aid: kula-bio
name: Kula Bio
description: >-
  Kula Bio is an agricultural biotechnology company headquartered in Natick, Massachusetts that
  manufactures Kula-N, a nitrogen-fixing microbial biofertilizer built on the bacterium Xanthobacter
  autotrophicus. The company's process, originating in Dr. Dan Nocera's research, "supercharges" the
  microbe with renewable energy so it fixes atmospheric nitrogen at the root zone, letting growers
  replace a portion of synthetic nitrogen while cutting the greenhouse-gas footprint of the applied
  product. Kula Bio sells a liquid formulation and, since February 2026, a Soluble Powder (SP) line,
  serving produce and row-crop growers through agronomic distribution rather than through software.
  It raised a $50M Series A led by Lowercarbon Capital and was named to TIME's list of America's Top
  GreenTech Companies of 2026. Kula Bio publishes no developer program, API, SDK, or machine-readable
  contract of any kind; this profile records that measured absence alongside its verified public
  corporate surface.
